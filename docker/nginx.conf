# hanpath — SPA + reverse proxy.
#
# One origin for the browser: the built SPA is served from disk, everything the API owns
# is proxied. If the SPA were served from a different host than the API, the session
# cookie would be third-party and browsers would silently drop it.

upstream hanpath_api {
    server api:8081;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A learner recording is capped server-side at 1 MiB; the proxy ceiling is headroom,
    # not a target.
    client_max_body_size 4m;

    # Compression for the text the SPA is made of. Audio and fonts are already compressed.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # The licence notice and anything else that must not be cached aggressively.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- API --------------------------------------------------------------------
    # No trailing slash on proxy_pass: the request path is passed through unchanged
    # (/api/v1/... stays /api/v1/...).
    location /api/ {
        proxy_pass http://hanpath_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Reference audio, served by the API from MEDIA_DIR (MEDIA_URL_PREFIX=/media).
    location /media/ {
        proxy_pass http://hanpath_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://hanpath_api;
        access_log off;
    }

    # --- static ---------------------------------------------------------------
    # Hashed bundle filenames: cache them for a year, they cannot change under the same
    # name. index.html is revalidated so a deploy is picked up.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Stroke-order data and icons: stable names, medium cache.
    location /hanzi/ {
        expires 30d;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # --- SPA ------------------------------------------------------------------
    # Client-side routing: every unknown path is the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
