levels:
    - level: 3
      stage: intermediate
      title: Level 3 — core vocabulary
      description: The published HSK 2.0 level-3 word list in frequency order, practised as meaning, listening and speaking drills. Thematic units are not yet curated; every word is covered by a meaning drill, a listening drill and a speaking drill.
      vocab_target: 298
      units:
