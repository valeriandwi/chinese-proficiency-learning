levels:
    - level: 2
      stage: elementary
      title: Level 2 — core vocabulary
      description: The published HSK 2.0 level-2 word list in frequency order, practised as meaning, listening and speaking drills. Thematic units are not yet curated; every word is covered by a meaning drill, a listening drill and a speaking drill.
      vocab_target: 147
      units:
        - unit: 1
          title: 词汇 1–24
          description: Words 1–24 of the published HSK 2.0 level-2 list, in frequency order.
          lessons:
            - lesson: 1
              title: 词汇 1–6
              kind: lesson
              goal: Recognise and say words 1–6.
              xp_reward: 12
              estimated_minutes: 12
              vocabulary:
                - ba1
                - Bai2
                - Bai3
                - bang1zhu4
                - bao4zhi3
                - Bi3
              passages: []
              exercises:
                - key: l2-w1-mcq1
                  type: mcq
                  skill: vocabulary
                  difficulty: 1
                  explanation: 吧 (bā) means “bar (loanword)”.
                  prompt:
                    options:
                        - id: a
                          text: 吧
                        - id: b
                          text: 别
                        - id: c
                          text: 船
                        - id: d
                          text: 从
                    question: Which word means “bar (loanword)”?
                  answer_key:
                    correct_id: a
                    why: 吧 is read bā and means “bar (loanword)”.
                - key: l2-w1-listen1
                  type: listening_mcq
                  skill: listening
                  difficulty: 1
                  explanation: You heard 吧 (bā), meaning “bar (loanword)”.
                  prompt:
                    audio_text: 吧
                    instruction: Listen, then choose what was said.
                    options:
                        - id: a
                          text: 吧
                        - id: b
                          text: 别
                        - id: c
                          text: 船
                        - id: d
                          text: 从
                    replay_limit: 3
                  answer_key:
                    correct_id: a
                    transcript: 吧
                    why: 'The clip says 吧 (bā): “bar (loanword)”.'
                - key: l2-w1-speak1
                  type: speak_repeat
                  skill: speaking
                  difficulty: 1
                  explanation: Repeat 吧 (bā) after the model. Nothing here grades your tones.
                  prompt:
                    audio_text: 吧
                    instruction: Listen to the model, then record yourself repeating the word. Play both back and compare — nothing here grades your tones.
                    max_seconds: 8
                    pinyin: bā
                    text: 吧
                    tone_note: Aim for 1st tone — high level
                  answer_key:
                    reference_text: 吧
                - key: l2-w1-tone1
                  type: tone_mcq
                  skill: listening
                  difficulty: 1
                  explanation: 吧 (bā) is 1 — 1st tone — high level.
                  prompt:
                    audio_text: 吧
                    instruction: Listen, then choose the tone you heard.
                    options:
                        - id: a
                          text: 2nd tone — rising
                        - id: b
                          text: 3rd tone — falling then rising
                        - id: c
