levels:
    - level: 1
      stage: elementary
      title: Level 1 — survival Mandarin
      description: Greetings, names, people, and the clock. Everything here is usable in a first conversation.
      vocab_target: 150
      units:
        - unit: 4
          title: 声调 — tones
          description: 'One tone drill per word of this level: which tone you hear, and what is written. Tones decide whether spoken Chinese is understood, and these need no pronunciation service to be checked.'
          lessons:
            - lesson: 1
              title: 声调 1–6
              kind: lesson
              goal: Name the tone of every word in this set.
              xp_reward: 10
              estimated_minutes: 3
              vocabulary:
                - ni3
                - wo3
                - hao3
                - shi4
                - ma
                - xie4xie
              passages: []
              exercises:
                - key: l1-tone-u4-l1-tone1
                  type: tone_mcq
                  skill: listening
                  difficulty: 1
                  explanation: 你 (nǐ) is 3 — 3rd tone — falling then rising.
                  prompt:
                    audio_text: 你
                    instruction: Listen, then choose the tone you heard.
                    options:
                        - id: a
                          text: 4th tone — falling
                        - id: b
                          text: 3rd tone — falling then rising
                        - id: c
                          text: 1st tone — high level
                        - id: d
                          text: 2nd tone — rising
                    replay_limit: 3
                    text: 你
                  answer_key:
                    correct_id: b
                    tones: "3"
                    why: 你 (nǐ) is 3 — 3rd tone — falling then rising.
