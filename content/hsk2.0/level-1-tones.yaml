# Generated by cmd/contentgen — do not edit by hand.
#
# Vocabulary comes from the published HSK 2.0 word lists via the Complete HSK
# Vocabulary project (MIT); see content/hsk2.0/VOCABULARY-LICENCE.txt for the notice
# and the fetch command. Drills are derived from the words themselves: this file
# contains no authored sentences, because a generator cannot be trusted to write
# grammatical Chinese.
version: hsk2.0
name: HSK 2.0 — Levels 1-6
standard: HSK 2.0 (Chinese Testing International six-level syllabus)
stage_model: six-levels
status: published
effective_from: "2010-01-01"
notes: |
    The legacy six-level HSK syllabus. Vocabulary placement follows the published
    HSK 2.0 level word lists; definitions and example sentences here are authored
    for this application (see docs/sources.md for what is derived from third-party
    data and under which licence).

    HSK 3.0 (three stages, nine levels) is a separate curriculum version and is
    imported alongside this one — nothing in the application assumes six levels.

    Levels 2 to 5 are generated from the same published word lists by
    cmd/contentgen, and carry only the drills that can be derived from a word without
    inventing language: meaning, listening, dictation, speaking and stroke order.
    Authored sentences — fill_blank, sentence_order, translation, short_answer — exist
    only where a person wrote them, which today means this file.

    Every listening drill needs generated reference audio; the importer synthesises it
    from the item's audio_text and stores a content-hash key, so an item whose audio
    cannot be produced fails the import instead of shipping a silent lesson.
