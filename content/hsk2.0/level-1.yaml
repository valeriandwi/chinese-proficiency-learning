passages:
  - kind: reading
    title: 我的一天
    level: 1
    instruction: Read the text, then answer the questions. Tap a word to see its meaning.
    body: 我早上七点起床。我上午去学校学习汉语。我中午在学校吃饭。我晚上在家喝水、看书。今天我认识了一个新朋友，我很高兴。
    sentences:
      - zh: 我早上七点起床。
        pinyin: Wǒ zǎoshang qī diǎn qǐchuáng.
        en: I get up at seven in the morning.
        tokens:
          - {zh: 我, pinyin: wǒ, en: "I"}
          - {zh: 早上, pinyin: zǎoshang, en: "morning"}
          - {zh: 七, pinyin: qī, en: "seven"}
          - {zh: 点, pinyin: diǎn, en: "o'clock"}
          - {zh: 起床, pinyin: qǐchuáng, en: "get up"}
      - zh: 我上午去学校学习汉语。
        pinyin: Wǒ shàngwǔ qù xuéxiào xuéxí Hànyǔ.
        en: In the morning I go to school to study Chinese.
      - zh: 我中午在学校吃饭。
        pinyin: Wǒ zhōngwǔ zài xuéxiào chīfàn.
        en: At noon I eat at school.
      - zh: 我晚上在家喝水、看书。
        pinyin: Wǒ wǎnshang zài jiā hē shuǐ, kàn shū.
        en: In the evening I drink water and read at home.
      - zh: 今天我认识了一个新朋友，我很高兴。
        pinyin: Jīntiān wǒ rènshi le yí gè xīn péngyou, wǒ hěn gāoxìng.
        en: Today I met a new friend, I am very happy.
    word_count: 51
    minutes: 3

levels:
  - level: 1
    stage: elementary
    title: Level 1 — survival Mandarin
    description: Greetings, names, people, and the clock. Everything here is usable in a first conversation.
    vocab_target: 150
    units:
      - unit: 1
        title: 你好 — greetings and names
        description: Say hello, give your name, and ask for someone else's.
        lessons:
          - lesson: 1
            title: 你好 — saying hello
            kind: lesson
            goal: Greet someone, say who you are, and thank them.
            xp_reward: 10
            estimated_minutes: 6
            vocabulary: [ni3, wo3, hao3, shi4, ma, xie4xie, zai4jian4]
            exercises:
              - key: l1-greet-mcq1
                type: mcq
                skill: vocabulary
                difficulty: 1
                explanation: 你 (nǐ) is the singular "you"; 我 (wǒ) is "I", 好 (hǎo) is "good" and 是 (shì) is "to be".
                prompt:
                  question: Which character means "you"?
                  options:
                    - {id: a, text: "你"}
                    - {id: b, text: "我"}
                    - {id: c, text: "好"}
                    - {id: d, text: "是"}
                answer_key:
                  correct_id: a
                  why: 你 (nǐ) is "you". 我 (wǒ) is "I".
              - key: l1-greet-mcq2
                type: mcq
                skill: vocabulary
                difficulty: 1
                prompt:
                  question: What does 谢谢 mean?
                  options:
                    - {id: a, text: "hello"}
                    - {id: b, text: "thank you"}
                    - {id: c, text: "goodbye"}
                    - {id: d, text: "sorry"}
                answer_key:
                  correct_id: b
              - key: l1-greet-tf1
                type: true_false
                skill: reading
                difficulty: 1
                explanation: 你好 (nǐ hǎo) is the standard greeting — literally "you good".
                prompt:
                  statement: 你好 is the standard way to greet someone in Mandarin.
                answer_key:
                  correct: true
                  why: 你好 is the everyday greeting, used from morning to evening.
              - key: l1-greet-fill1
                type: fill_blank
                skill: writing
                difficulty: 1
                explanation: 你 plus 好 makes the greeting 你好.
                prompt:
                  sentence: 你___！
                  pinyin: nǐ ___
                  hint: Complete the greeting "hello".
                  word_bank: [好, 是, 我]
                answer_key:
                  accepted: [好]
              - key: l1-greet-listen1
                type: listening_mcq
                skill: listening
                difficulty: 1
                explanation: 吗 is the yes/no question marker; 你好 on its own is just a greeting.
                prompt:
                  instruction: Listen, then choose what was said.
                  audio_text: 你好吗？
                  replay_limit: 2
                  options:
                    - {id: a, text: "How are you?"}
                    - {id: b, text: "Thank you."}
                    - {id: c, text: "Goodbye."}
                    - {id: d, text: "I am fine."}
                answer_key:
                  correct_id: a
                  transcript: 你好吗？
                  why: "吗 (ma) at the end turns 你好 into a question: “how are you?”"
              - key: l1-greet-listen2
                type: listening_dictation
                skill: listening
                difficulty: 2
                explanation: 谢谢 is “thank you”; adding 你 makes it “thank you (to you)”.
                prompt:
                  instruction: Listen and type the sentence you hear, in Chinese characters.
                  audio_text: 谢谢你。
                  replay_limit: 2
                answer_key:
                  accepted: [谢谢你, 谢谢你。]
                  transcript: 谢谢你。
                  pinyin: Xièxie nǐ.
              - key: l1-greet-speak1
                type: speak_repeat
                skill: speaking
                difficulty: 2
                explanation: 你好 + 我叫… is the shortest complete self-introduction.
                prompt:
                  instruction: Listen to the model, then record yourself repeating it. Play both back and compare — nothing here grades your tones.
                  audio_text: 你好！我叫小明。
                  text: 你好！我叫小明。
                  pinyin: Nǐ hǎo! Wǒ jiào Xiǎomíng.
                  max_seconds: 15
                answer_key:
                  reference_text: 你好！我叫小明。
              - key: l1-greet-speak2
                type: read_aloud
                skill: speaking
                difficulty: 2
                prompt:
                  instruction: Read this aloud, then record it. Your recording stays in the browser for comparison and is not uploaded.
                  text: 你好，我是学生。谢谢你，再见！
                  pinyin: Nǐ hǎo, wǒ shì xuéshēng. Xièxie nǐ, zàijiàn!
                  max_seconds: 20
                answer_key:
                  reference_text: 你好，我是学生。谢谢你，再见！
              - key: l1-greet-hanzi1
                type: hanzi_trace
                skill: writing
                difficulty: 2
                explanation: 你 is written left to right — the person radical 亻 first, then 尔.
                prompt:
                  character: 你
                  mode: guided
                  stroke_count: 7
                  instruction: Trace 你 in the correct stroke order.
                answer_key:
                  character: 你
                  stroke_count: 7

          - lesson: 2
            title: 你叫什么名字 — asking names
            kind: lesson
            goal: Ask for and give a name.
            xp_reward: 10
            estimated_minutes: 7
            vocabulary: [jiao4, shen2me, ming2zi, ni3, wo3, shi4, xue2sheng]
            exercises:
              - key: l2-name-mcq1
                type: mcq
                skill: vocabulary
                difficulty: 1
                prompt:
                  question: 名字 means…
                  options:
                    - {id: a, text: "name"}
                    - {id: b, text: "teacher"}
                    - {id: c, text: "friend"}
                    - {id: d, text: "school"}
                answer_key:
                  correct_id: a
              - key: l2-name-order1
                type: sentence_order
                skill: writing
                difficulty: 3
                explanation: Mandarin word order is subject, verb, object — 我 (subject) 叫 (verb) 小明 (object).
                prompt:
                  instruction: Put the words in order to say "My name is Xiaoming."
                  tokens: [叫, 我, 小明]
                  pinyin: wǒ jiào Xiǎomíng
                answer_key:
                  order: [1, 0, 2]
                  full_pinyin: wǒ jiào Xiǎomíng
              - key: l2-name-fill1
                type: fill_blank
                skill: grammar
                difficulty: 2
                explanation: 什么 goes before the noun it asks about, so 什么名字 is "what name".
                prompt:
                  sentence: 你叫___名字？
                  pinyin: nǐ jiào ___ míngzi?
                  hint: Add the question word for "what".
                  word_bank: [什么, 好, 我]
                answer_key:
                  accepted: [什么]
              - key: l2-name-listen1
                type: listening_mcq
                skill: listening
                difficulty: 1
                prompt:
                  instruction: Listen, then choose what was said.
                  audio_text: 你叫什么名字？
                  replay_limit: 2
                  options:
                    - {id: a, text: "What is your name?"}
                    - {id: b, text: "How are you?"}
                    - {id: c, text: "Where are you from?"}
                    - {id: d, text: "Who is he?"}
                answer_key:
                  correct_id: a
                  transcript: 你叫什么名字？
                  why: 什么 is “what” and 名字 is “name”.
              - key: l2-name-listen2
                type: listening_dictation
                skill: listening
                difficulty: 2
                explanation: "叫 (jiào) is how you give your own name: 我叫小明."
                prompt:
                  instruction: Listen and type the sentence you hear, in Chinese characters.
                  audio_text: 我叫小明。
                  replay_limit: 2
                answer_key:
                  accepted: [我叫小明, 我叫小明。]
                  transcript: 我叫小明。
                  pinyin: Wǒ jiào Xiǎomíng.
              - key: l2-name-speak1
                type: speak_repeat
                skill: speaking
                difficulty: 2
                prompt:
                  instruction: Listen to the model, then record yourself repeating it. Play both back and compare — nothing here grades your tones.
                  audio_text: 你叫什么名字？
                  text: 你叫什么名字？
                  pinyin: Nǐ jiào shénme míngzi?
                  max_seconds: 12
                answer_key:
                  reference_text: 你叫什么名字？
              - key: l2-name-speak2
                type: speak_answer
                skill: speaking
                difficulty: 3
                prompt:
                  instruction: Answer the question out loud in a full sentence. You get 10 seconds to think first.
                  question: 你叫什么名字？
                  key_points: [我叫…, 我是…]
                  prep_seconds: 10
                  max_seconds: 20
                answer_key:
                  reference_text: 我叫小明。
              - key: l2-name-trans1
                type: translation
                skill: writing
                difficulty: 2
                explanation: A yes/no question adds the particle 吗 at the end, so "are you a student" becomes 你是学生吗？
                prompt:
                  instruction: Translate into Chinese.
                  direction: en->zh
                  source: Are you a student?
                  hint: Add the yes/no question particle.
                answer_key:
                  accepted: [你是学生吗, 你是学生吗？]
                  reference: 你是学生吗？

