openapi: 3.1.0
info:
  title: hanpath API
  version: 1.0.0
  description: |
    HSK Mandarin learning platform API.

    Conventions that hold for every endpoint:

    * **Authentication** is a session cookie (`hanpath_session`, HttpOnly,
      SameSite=Lax) issued by `/auth/login` and `/auth/register`. There is no
      bearer token: the SPA is served same-origin with the API, so a cookie is
      both simpler and revocable.
    * **Writes require CSRF.** Any non-GET request must send the double-submit
      token that is set in the readable `hanpath_csrf` cookie, in the
      `X-CSRF-Token` header. A missing or stale token is `403 csrf_failed`.
    * **Request bodies are strict.** An unknown field is `400 unknown_field`, not
      something silently ignored.
    * **Errors** always use the same envelope: `{ "error": { code, message,
      details?, request_id } }`. List fields are always arrays, never `null`.
    * **Answer keys never leave the server** before grading. `GET /lessons/{id}`
      carries no answer key at all; a graded attempt returns the solution.
    * **Exam mode withholds feedback.** Submitting with `mode: "exam"` returns
      per-answer correctness but no solution, feedback or explanation.

    Milestone status: M0 (foundation) and the core of M1 (accounts, path,
    practice lessons, progress, streaks, spaced repetition) are implemented, as
    are the listening and speaking exercise families. Mock exams are designed but
    not yet shipped.

    Audio: reference clips are generated at import time and served by this API at
    `/media/{key}` (same origin, immutable). A lesson's prompt carries the storage
    `audio_key` plus a resolved `audio_url` the client can play directly.

    Speaking is not judged: there is no speech recognition in this build, so a
    speaking result always has `is_correct: null`, `needs_review: true` and a
    `limitation` string. Listening IS judged, like any other mechanically gradable
    type.
servers:
  - url: http://127.0.0.1:8081
    description: Local development (the SPA reaches this through its Vite proxy)
tags:
  - name: auth
  - name: profile
  - name: curriculum
  - name: lessons
  - name: progress
  - name: reviews
  - name: health

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      responses:
        '200':
          description: The process is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  version: { type: string }
                  uptime_seconds: { type: integer }

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe, including schema version
      responses:
        '200':
          description: Database reachable and every migration applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ready }
                  version: { type: string }
                  migrations_applied: { type: integer }
        '503':
          description: Database unreachable or migrations pending

  /media/{key}:
    get:
      tags: [curriculum]
      summary: Fetch a stored learning asset (reference audio)
      description: |
        Public, like the curriculum catalogue: reference audio is publishable
        content, not learner data. Served from the same origin as the SPA so an
        `<audio>` element needs no cross-site request.

        The asset key is a hash of the clip's own bytes, so the response is
        immutable and cached for a year; a changed clip is a different key. A key
        that is missing, or that tries to escape the storage directory, is a 404.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
          description: Content-hash asset name, e.g. `02e323b984b6a98f84106ac363a858e9.mp3`
      responses:
        '200':
          description: The asset bytes
          headers:
            Cache-Control:
              schema: { type: string }
              description: '`public, max-age=31536000, immutable`'
          content:
            audio/mpeg: { schema: { type: string, format: binary } }
        '404':
          description: No such asset
        '503':
          description: This deployment has no media store configured

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Create a learner account and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, display_name, password]
              properties:
                email: { type: string, format: email }
                display_name: { type: string, maxLength: 60 }
                password:
                  type: string
                  minLength: 8
                  description: At least 8 characters, not a common word or sequence.
                timezone:
                  type: string
                  description: IANA name. Decides which calendar day a streak counts.
                  default: Asia/Jakarta
                daily_goal_minutes: { type: integer, minimum: 5, maximum: 600, default: 20 }
      responses:
        '201':
          description: Account created, session cookies set
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  csrf_token: { type: string }
                  message: { type: string }
        '409':
          description: That email address is already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: A field is invalid (see `details`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Session cookies set
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  csrf_token: { type: string }
        '401':
          description: Incorrect email or password (deliberately indistinguishable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session
      responses:
        '204': { description: Session revoked and cookies cleared }

  /api/v1/auth/session:
    get:
      tags: [auth]
      summary: Who am I (the SPA's boot call)
      responses:
        '200':
          description: Session state; the CSRF token when authenticated
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      authenticated: { type: boolean, const: false }
                  - type: object
                    properties:
                      authenticated: { type: boolean, const: true }
                      user: { $ref: '#/components/schemas/User' }
                      csrf_token: { type: string }

  /api/v1/auth/verify-email:
    post:
      tags: [auth]
      summary: Consume an email verification token (single use)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200': { description: Verified }
        '400': { description: Invalid, expired or already used token }

  /api/v1/auth/password-reset/request:
    post:
      tags: [auth]
      summary: Request a password reset link
      description: Always answers 202, whether or not the address is registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
      responses:
        '202': { description: Accepted }

  /api/v1/auth/password-reset/confirm:
    post:
      tags: [auth]
      summary: Set a new password and sign out every other session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Password replaced
          content:
            application/json:
              schema:
                type: object
                properties:
                  reset: { type: boolean }
                  sessions_revoked: { type: integer }
        '400': { description: Invalid or expired token }

  /api/v1/me:
    get:
      tags: [profile]
      summary: The signed-in learner
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { description: Not signed in }
    patch:
      tags: [profile]
      summary: Update profile and learning preferences
      description: |
        Partial update. Changing the timezone or the daily goal recomputes every
        derived daily bucket immediately, because those values decide what a
        streak day is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
                timezone: { type: string }
                daily_goal_kind: { type: string, enum: [minutes, xp, lessons] }
                daily_goal_value: { type: integer, minimum: 1, maximum: 600 }
                pinyin_default: { type: string, enum: [always, on_tap, never] }
                target_curriculum: { type: string }
                target_level: { type: integer, minimum: 1, maximum: 9 }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '422': { description: A field is invalid }

  /api/v1/placement/questions:
    get:
      tags: [profile]
      summary: Vocabulary for the placement self-check
      parameters:
        - { name: version, in: query, schema: { type: string }, description: Curriculum version; defaults to hsk2.0 }
        - { name: level, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: |
            A recognition self-check, not a scored test. The response says so in
            `self_report` and the UI repeats it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  level: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Lexeme' }
                  self_report: { type: string }

  /api/v1/me/placement:
    post:
      tags: [profile]
      summary: Record placement and receive a recommended level
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, presented]
              properties:
                version: { type: string }
                known_lexeme_ids:
                  type: array
                  items: { type: string, format: uuid }
                presented: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  score: { type: number, minimum: 0, maximum: 1 }
                  recommended: { type: integer }
                  note: { type: string }

  /api/v1/curriculum:
    get:
      tags: [curriculum]
      summary: List curriculum versions with their levels
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  curricula:
                    type: array
                    items: { $ref: '#/components/schemas/Curriculum' }

  /api/v1/curriculum/{version}/path:
    get:
      tags: [curriculum]
      summary: The learner's path for one curriculum version
      description: |
        Lessons come back in path order with a derived state. The path is linear
        across the version: exactly one unfinished lesson is `available`.
      parameters:
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  levels:
                    type: array
                    items: { $ref: '#/components/schemas/PathLevel' }
        '404': { description: Unknown curriculum version }

  /api/v1/lessons/{id}:
    get:
      tags: [lessons]
      summary: Everything the lesson player needs
      description: |
        Carries no answer key. A lesson that is still `locked` may be read (so the
        UI can preview it) but not submitted to.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonDetail' }
        '404': { description: Unknown lesson }

  /api/v1/lessons/{id}/attempts:
    post:
      tags: [lessons]
      summary: Grade and record a batch of answers
      description: |
        Grading happens server-side for every type. Answers are recorded atomically
        and every derived value (lesson progress, XP, review deck, daily activity,
        streak) is recomputed in the same transaction.

        `client_ref` must be unique per attempt: replaying a reference is an
        idempotent no-op, and reusing one for a *different* exercise is `409`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attempts]
              properties:
                mode: { type: string, enum: [practice, review, exam, placement], default: practice }
                attempts:
                  type: array
                  maxItems: 100
                  items: { $ref: '#/components/schemas/AttemptInput' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmitSummary' }
        '403':
          description: The lesson is locked, or an exercise belongs to another lesson
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409': { description: A client_ref was reused for a different exercise }
        '422': { description: Empty batch, too large, unknown exercise or bad mode }

  /api/v1/recordings:
    post:
      tags: [lessons]
      summary: Score a spoken recording against its drill's reference
      description: |
        The one endpoint that accepts a learner's voice. Scoring is server-side: the
        audio is read into memory, handed to the configured pronunciation provider and
        dropped — it is never written to storage, and the UI says so before the learner
        records.

        Only drills with a single reference utterance (`speak_repeat`, `read_aloud`) can
        be scored: an open speaking prompt has nothing to compare against and returns
        `422`. The score is stored, and an attempt that names it with `recording_id` is
        graded from that stored value. A client can name a recording it owns; it can
        never send a score.

        `503` means this deployment has no pronunciation provider configured, which is a
        supported configuration: speaking drills then stay self-assessed, exactly as
        they behaved before scoring existed.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [exercise_id, audio]
              properties:
                exercise_id: { type: string, format: uuid }
                audio:
                  type: string
                  format: binary
                  description: The recording as the browser produced it (WebM/Opus, WAV, OGG/Opus).
      responses:
        '200':
          description: Scored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordingScore' }
        '400': { description: The audio part is missing or unreadable }
        '413': { description: The recording is larger than this deployment accepts }
        '422':
          description: Not a speaking drill, no reference utterance, unsupported audio, or no speech recognised
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { description: Per-learner rate limit, or the daily scoring cap for this account }
        '502': { description: The provider failed, or rejected the configured credentials }
        '503': { description: No pronunciation provider is configured on this deployment }

  /api/v1/progress/overview:
    get:
      tags: [progress]
      summary: Dashboard payload, derived from the attempt log
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressOverview' }

  /api/v1/progress/refresh:
    post:
      tags: [progress]
      summary: Recompute every derived value and return the fresh overview
      description: |
        The escape hatch for "the numbers look stale": lesson progress, XP, skill
        mastery, daily rollups and the streak are all rebuilt from attempts.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressOverview' }

  /api/v1/proficiency/cards:
    get:
      tags: [proficiency]
      summary: Test-out cards for every level
      description: |
        Placement recommends a level and says so; a proficiency paper decides. Passing one
        at the pass mark records a level unlock — never a completion: no lesson is marked
        done, no XP is awarded, and the level's lessons become *available*.
      parameters:
        - { name: version, in: query, schema: { type: string }, description: 'Curriculum version; defaults to the app default' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards:
                    type: array
                    items: { $ref: '#/components/schemas/ProficiencyCard' }
                  pass_threshold: { type: number, description: 'Fraction of graded answers needed to pass' }
                  paper_size: { type: integer }

  /api/v1/proficiency/{level}:
    get:
      tags: [proficiency]
      summary: Draw a paper for a level
      description: |
        The paper is drawn by the server and stored before it is sat, so the submission can
        be checked against it. Only mechanically gradable questions are drawn — meaning,
        listening, tone, dictation — because a rubric item or an unassisted speaking prompt
        could not decide whether a level opens.
      parameters:
        - { name: level, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 9 } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  paper_id: { type: string, format: uuid }
                  level: { type: object, additionalProperties: true }
                  questions:
                    type: array
                    items: { $ref: '#/components/schemas/ToneDrill' }
                  pass_threshold: { type: number }
        '404': { description: 'No gradable questions at this level' }

  /api/v1/proficiency/{level}/submit:
    post:
      tags: [proficiency]
      summary: Grade a drawn paper and open the level if it passes
      description: |
        Every drawn question must be answered, and nothing outside the paper is graded.
        Attempts are recorded with mode `proficiency` and excluded from every derived
        value: a paper samples lessons the learner has not reached, so it must not move
        lesson status, XP, mastery, the daily rollup or the streak.
      parameters:
        - { name: level, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 9 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paper_id, answers]
              properties:
                paper_id: { type: string, format: uuid }
                answers:
                  type: array
                  items:
                    type: object
                    required: [exercise_id, response]
                    properties:
                      exercise_id: { type: string, format: uuid }
                      client_ref: { type: string }
                      response: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/AttemptResult' }
                  paper:
                    type: object
                    additionalProperties: true
                  unlocked_now: { type: boolean, description: 'True only for the paper that opened the level' }
        '409': { description: '`already_submitted` when the paper has been sat' }
        '422': { description: '`incomplete_paper` or `not_in_paper` when the submission does not match the drawn paper' }

  /api/v1/tones/queue:
    get:
      tags: [tones]
      summary: Tone drills to practise, outside the lesson path
      description: |
        Tone questions from any level — deliberately NOT gated by the path, because a
        tone drill is self-contained and this surface exists so a learner can work on
        tone without walking a level first. Filtered by level instead: answering
        questions about words you have never met teaches nothing. Defaults to the
        learner's own level. Answer keys never appear here.
      parameters:
        - { name: level, in: query, schema: { type: integer, default: 0, minimum: 0, maximum: 5 }, description: '0 = every level; otherwise 1-5' }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 50 } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ToneDrill' }
                  level: { type: integer, description: The level the drills were drawn from; 0 means every level }
                  stats:
                    type: array
                    items: { $ref: '#/components/schemas/ToneLevelStat' }

  /api/v1/tones/answers:
    post:
      tags: [tones]
      summary: Grade tone answers and report which tones were missed
      description: |
        Graded by the same registry as every other exercise type, and recorded with
        mode `tone`: the attempt log keeps the learner's tone record, while lesson
        status, XP, mastery, the daily rollup and the streak are all left untouched.
        Practising tone must not advance a lesson the learner has not unlocked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [exercise_id, option_id]
                    properties:
                      exercise_id: { type: string, format: uuid }
                      client_ref: { type: string, description: Unique per attempt; makes a retried submit idempotent. }
                      option_id: { type: string }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/AttemptResult' }
                  tone_tally:
                    type: array
                    description: Per tone, how often it came up in this batch and how often it was missed.
                    items: { $ref: '#/components/schemas/ToneTallyRow' }
                  stats:
                    type: array
                    items: { $ref: '#/components/schemas/ToneLevelStat' }
        '422':
          description: '`not_a_tone_drill` when an exercise id is not a tone drill'

  /api/v1/reviews/queue:
    get:
      tags: [reviews]
      summary: Vocabulary cards due now
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReviewItem' }
                  due_total: { type: integer }

  /api/v1/reviews/answer:
    post:
      tags: [reviews]
      summary: Grade one review card and schedule the next one
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lexeme_id, correct]
              properties:
                lexeme_id: { type: string, format: uuid }
                correct: { type: boolean }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  lexeme_id: { type: string, format: uuid }
                  interval_index: { type: integer, description: Position on the interval ladder }
                  ease: { type: number }
                  due_at: { type: string, format: date-time }
                  due_total: { type: integer }
        '404': { description: That word is not in the learner's deck }

components:
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [bad_request, invalid_json, unknown_field, validation_failed, unauthorized,
                 forbidden, csrf_failed, origin_rejected, lesson_locked, not_found, conflict,
                 email_taken, client_ref_conflict, rate_limited, invalid_token,
                 unsupported_media_type, body_too_large, internal_error]
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
            request_id: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [learner, admin] }
        email_verified_at: { type: [string, 'null'], format: date-time }
        timezone: { type: string }
        daily_goal_value: { type: integer }
        daily_goal_kind: { type: string, enum: [minutes, xp, lessons] }
        pinyin_default: { type: string, enum: [always, on_tap, never] }
        target_curriculum: { type: [string, 'null'] }
        target_level: { type: [integer, 'null'] }
        placement_completed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Curriculum:
      type: object
      properties:
        id: { type: string, format: uuid }
        version: { type: string, example: hsk2.0 }
        name: { type: string }
        standard: { type: string }
        stage_model: { type: string, enum: [six-levels, three-stages-nine-levels] }
        status: { type: string, enum: [draft, published, archived] }
        effective_from: { type: [string, 'null'], format: date }
        level_count: { type: integer }
        lesson_count: { type: integer }
        exercise_count: { type: integer }
        levels:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              level_number: { type: integer }
              stage: { type: [string, 'null'] }
              title: { type: string }

    PathLevel:
      type: object
      properties:
        id: { type: string, format: uuid }
        level_number: { type: integer }
        stage: { type: [string, 'null'] }
        title: { type: string }
        completed_lessons: { type: integer }
        total_lessons: { type: integer }
        units:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              unit_number: { type: integer }
              title: { type: string }
              lessons:
                type: array
                items: { $ref: '#/components/schemas/LessonSummary' }

    LessonSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        lesson_number: { type: integer }
        title: { type: string }
        kind: { type: string, enum: [lesson, review, assessment, mock_exam] }
        xp_reward: { type: integer }
        estimated_minutes: { type: integer }
        exercise_count: { type: integer }
        state: { $ref: '#/components/schemas/LessonState' }
        best_score: { type: [number, 'null'] }
        attempts: { type: integer }
        completed_at: { type: [string, 'null'], format: date-time }

    LessonState:
      type: string
      enum: [locked, available, in_progress, completed]
      description: |
        Derived, never stored as-is: `locked` and `available` come from position in
        the path plus the learner's completed set.

    Lexeme:
      type: object
      properties:
        id: { type: string, format: uuid }
        simplified: { type: string }
        traditional: { type: string }
        pinyin: { type: string }
        parts_of_speech:
          type: array
          items: { type: string }
        senses:
          type: array
          items:
            type: object
            additionalProperties: true
        audio_key: { type: [string, 'null'] }
        hsk_level: { type: [integer, 'null'] }

    Passage:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [reading, listening] }
        title: { type: string }
        instruction: { type: string }
        body: { type: string }
        sentences:
          type: array
          description: Pre-segmented at import time, so no tokenizer runs per request.
          items:
            type: object
            properties:
              zh: { type: string }
              pinyin: { type: string }
              en: { type: string }
        audio_key: { type: [string, 'null'] }
        word_count: { type: integer }
        minutes: { type: integer }

    Exercise:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        type:
          type: string
          description: |
            The registry's exercise types. `listening_*` items are graded against an
            answer key and expose `prompt.audio_url`; `speak_*` items are not graded
            (see the API description) and submit a recording's metadata, never audio.
          enum: [mcq, mcq_multi, true_false, fill_blank, sentence_order, translation, hanzi_trace, hanzi_recall, short_answer, listening_mcq, listening_dictation, speak_repeat, read_aloud, speak_answer]
        skill: { type: string, enum: [vocabulary, grammar, reading, listening, writing, speaking] }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        prompt:
          type: object
          additionalProperties: true
          description: |
            Shape depends on `type`; validated at content-import time. Types that
            play audio carry `audio_key` (the stored asset name) and `audio_url`
            (resolved for the client). Note that a listening item's transcript is
            part of its ANSWER KEY, so it is absent here and only appears in a
            graded result — a lesson payload never contains it.

    LessonDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        kind: { type: string, enum: [lesson, review, assessment, mock_exam] }
        goal: { type: string }
        xp_reward: { type: integer }
        estimated_minutes: { type: integer }
        unit_title: { type: string }
        level_number: { type: integer }
        curriculum_version: { type: string }
        state: { $ref: '#/components/schemas/LessonState' }
        exercises:
          type: array
          items: { $ref: '#/components/schemas/Exercise' }
        passages:
          type: array
          items: { $ref: '#/components/schemas/Passage' }
        vocabulary:
          type: array
          items: { $ref: '#/components/schemas/Lexeme' }

    RecordingScore:
      type: object
      description: |
        A pronunciation assessment. Every ratio is 0..1; `passing_band` is the value at
        or above which the drill counts as done.
      required: [id, provider, overall, passing_band]
      properties:
        id:
          type: string
          format: uuid
          description: Name this in an attempt's `recording_id` to have it graded from this score.
        provider: { type: string, description: Which scorer produced it, e.g. azure or fake. }
        overall: { type: number, minimum: 0, maximum: 1 }
        accuracy: { type: number, minimum: 0, maximum: 1 }
        fluency: { type: number, minimum: 0, maximum: 1 }
        completeness: { type: number, minimum: 0, maximum: 1 }
        prosody: { type: number, minimum: 0, maximum: 1 }
        passing_band: { type: number, minimum: 0, maximum: 1 }
        reference: { type: string, description: The utterance that was assessed. }
        words:
          type: array
          description: Per-word assessment, which is the part a learner can act on.
          items:
            type: object
            required: [word, accuracy]
            properties:
              word: { type: string }
              accuracy: { type: number, minimum: 0, maximum: 1 }
              error_type: { type: string, description: 'Provider taxonomy, e.g. None or Mispronunciation.' }

    ProficiencyCard:
      type: object
      properties:
        level: { type: integer }
        title: { type: string }
        questions: { type: integer, description: 'Gradable questions this level can draw from' }
        unlocked_by_test: { type: boolean, description: 'A proficiency test opened this level' }
        best_score: { type: number, nullable: true }
        papers_taken: { type: integer }
        passed: { type: boolean }

    ToneDrill:
      description: One tone question as the learner sees it — the prompt, the level it comes from, and no answer key.
      type: object
      required: [id, type, prompt]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        type: { type: string, enum: [tone_mcq, listening_mcq] }
        skill: { type: string }
        difficulty: { type: integer }
        level: { type: integer }
        prompt: { type: object, additionalProperties: true }

    ToneLevelStat:
      type: object
      properties:
        level: { type: integer }
        drills: { type: integer, description: How many tone drills exist at this level }
        answered: { type: integer, description: Tone attempts by this learner }
        correct: { type: integer }

    ToneTallyRow:
      type: object
      properties:
        tone: { type: string, description: 'Tone digit, 1-5 (5 = neutral)' }
        label: { type: string, description: 'How the tone is described, e.g. "3rd tone — falling then rising"' }
        asked: { type: integer }
        missed: { type: integer }

    AttemptInput:
      type: object
      required: [exercise_id, response]
      properties:
        exercise_id: { type: string, format: uuid }
        client_ref:
          type: string
          description: Unique per attempt; makes a retried submit idempotent.
        response:
          type: object
          additionalProperties: true
        duration_ms: { type: integer, minimum: 0 }

    AttemptResult:
      type: object
      properties:
        exercise_id: { type: string, format: uuid }
        client_ref: { type: string }
        is_correct:
          type: [boolean, 'null']
          description: |
            `null` means "not mechanically gradable" — a free-form answer judged by
            a rubric. It is never reported as correct.
        score: { type: number, minimum: 0, maximum: 1 }
        grader: { type: string, description: How the answer was judged }
        feedback:
          type: [object, 'null']
          additionalProperties: true
        solution:
          type: [object, 'null']
          additionalProperties: true
          description: Absent in exam mode.
        explanation: { type: string }
        duplicate: { type: boolean }
        needs_review: { type: boolean }

    SubmitSummary:
      type: object
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/AttemptResult' }
        lessons:
          type: array
          items:
            type: object
            properties:
              lesson_id: { type: string, format: uuid }
              status: { type: string, enum: [in_progress, completed] }
              completed_now: { type: boolean }
              xp_awarded: { type: integer }
              correct: { type: integer }
              total: { type: integer }

    ProgressOverview:
      type: object
      properties:
        streak:
          type: object
          properties:
            current_streak: { type: integer }
            longest_streak: { type: integer }
            last_active_day: { type: [string, 'null'], format: date }
            goal_met_today: { type: boolean }
            goal_value: { type: integer }
            goal_kind: { type: string, enum: [minutes, xp, lessons] }
            today_xp: { type: integer }
            today_minutes: { type: integer }
        skills:
          type: array
          items:
            type: object
            properties:
              skill: { type: string }
              attempts: { type: integer }
              correct: { type: integer }
              mastery: { type: number, description: Mean score including partial credit }
        total_attempts: { type: integer }
        total_correct: { type: integer }
        lessons_completed: { type: integer }
        total_xp: { type: integer }
        due_reviews: { type: integer }
        curriculum_version: { type: string }
        next_lesson_id: { type: [string, 'null'], format: uuid }
        next_lesson_title: { type: string }
        activity:
          type: array
          description: Local-timezone calendar days, oldest first.
          items:
            type: object
            properties:
              day: { type: string, format: date }
              xp: { type: integer }
              minutes: { type: integer }
              attempts: { type: integer }
              goal_met: { type: boolean }

    ReviewItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        lexeme_id: { type: string, format: uuid }
        simplified: { type: string }
        traditional: { type: string }
        pinyin: { type: string }
        interval_index: { type: integer }
        ease: { type: number }
        reps: { type: integer }
        lapses: { type: integer }
        due_at: { type: string, format: date-time }
